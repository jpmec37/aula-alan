<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="../css/aula1.css" class="css" />

  <body>
    <a href="index.html">Voltar</a>
    <div class="testeaula">
      <div>
        <h4>Atividade 1: Desconto com Cupom</h4>
        <label for="valor1">Valor da Compra: </label>
        <input type="number" min="0" id="valor1" />
        <label for="cupom">Cupom: </label>
        <input type="text" id="cupom" />
        <button id="enviar1">Calcular</button>
      </div>
      <p id="resultado1"></p>
    </div>
    <div class="testeaula">
        <div>
      <h4>Atividade 2: Calculo Frete Grátis</h4>

      <input type="number" min="10" id="valor2" />
      <button id="enviar2">Calcular</button>
    </div>
      <p id="resultado2"></p>
    </div>
    <div class="testeaula">
        <div>
      <h4>Atividade 3: Senha Segura</h4>
      <label for="senha">Senha: </label>
      <input type="text" id="senha" />
      <button id="enviar3">Verificar</button>
    </div>
      <p id="resultado3"></p>
    </div>
    <div class="testeaula">
        <div>
      <h4>Atividade 4: Fechar Nota Aluno</h4>
      <label for="valor4">Nota Aluno</label>
      <input type="number" min="0" id="valor4" />
      <button id="enviar4">Fechar Nota</button>
    </div>
      <p id="resultado4"></p>
    </div>
    <div class="testeaula">
        <div>
      <h4>Atividade 5: Veficar Perigo Temperatura</h4>
      <label for="valor5">Temperatura</label>

      <p id="resultado5"></p>
    </div>
